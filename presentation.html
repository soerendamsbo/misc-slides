# Motivation

There is an urgent need for knowledge about:

1. How people will respond to the manifest consequences of climate change&lt;br&gt;(*Will it affect their political beliefs? Will they demand stronger/faster policy interventions from political leaders? Will they agree to adapt their lifestyles?*)

2. How climate communication can be made more effective 

3. How to sustain the climate crisis' position high on political agendas

---
layout: true
class: left, top

# Core research question

How do personal climate change experiences affect political opinions and behaviour towards climate change – and how is this relationship moderated or facilitated by how the media cover the climate crisis?

# Theory

--

* Opinion formation theory, political psychology, cognitive heuristics, motivated reasoning&lt;br&gt;(Zaller 1992; Taber and Lodge 2006)

--

* Agenda-setting and framing theory&lt;br&gt;(Dearing and Rogers 1996; Guo and McCombs 2016)

--

* Field-specific, climate-related literature&lt;br&gt;(highly multidisciplinary and empirical, 100-200 studies in past 10 years; e.g. Egan and Mullin 2012; Howe et al. 2019; Druckman and McGrath 2019)

---
class: left, top

# Research design ideal

--

1. Find **objective data on extreme weather** at individual/local (or regional/national) level

--

2. Find corresponding individual-level (or aggregate) data on **climate opinions** or climate-related behavior

--

3. Connect these using **quasiexperimental design** logics (the weather is often a good as-if random and exogenous 'treatment')

--

4. **Measure news coverage** of weather events and the climate crisis and/or individual news exposure

--

5. **Analyse** (causal) relationships statistically

???

Will have to depart from in some cases, especially when studying the media or when only aggregate data is available. Lower potential for causal inference.

# In sum, my project (hopefully):

--

1. Studies political (causal) effects of personal, everyday climate experiences - in the European/Danish context

--

2. Captures local, climate-related experiences with new types of 'objective' (meteorological) data

--

3. Measures media coverage of the climate crisis (quantity and character)

--

4. Investigates the interplay between personal climate experiences and media coverage
